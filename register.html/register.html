<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Fleet API パートナー登録</title>
<style>
body{font-family:-apple-system,sans-serif;margin:24px;line-height:1.6;color:#111}
input{width:100%;padding:10px;font-size:16px;box-sizing:border-box;margin:6px 0 14px}
button{padding:12px 20px;font-size:16px;background:#cc0000;color:#fff;border:0;border-radius:8px}
#out{white-space:pre-wrap;background:#f4f4f4;padding:12px;border-radius:8px;margin-top:16px;font-size:14px}
small{color:#555}
</style>
</head>
<body>
<h2>Tesla Fleet API パートナー登録</h2>
<p>このページはあなたのブラウザの中だけで動作します。入力した Client Secret は Tesla の認証サーバー（auth.tesla.com）へ直接送られるだけで、保存も外部送信もされません。</p>
<label>Client ID（入力済み）</label>
<input id="cid" value="63913b4e-6591-412d-b04f-9193f41b412a" readonly>
<label>Client Secret</label>
<input id="sec" type="password" placeholder="Teslaのアプリ詳細ページにある Client Secret">
<button id="go">登録する</button>
<div id="out">まだ実行していません。</div>
<p><small>処理内容: ①パートナートークン取得（client_credentials） ②ドメイン miyabi5215.github.io の登録（POST /api/1/partner_accounts）</small></p>
<script>
const out = document.getElementById('out');
document.getElementById('go').addEventListener('click', async () => {
  const sec = document.getElementById('sec').value.trim();
  if (!sec) { out.textContent = 'Client Secret を入力してください。'; return; }
  out.textContent = '① パートナートークンを取得中...';
  try {
    const body = new URLSearchParams({
      grant_type: 'client_credentials',
      client_id: document.getElementById('cid').value,
      client_secret: sec,
      scope: 'openid vehicle_device_data vehicle_location vehicle_charging_cmds',
      audience: 'https://fleet-api.prd.na.vn.cloud.tesla.com'
    });
    const tr = await fetch('https://auth.tesla.com/oauth2/v3/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    const tj = await tr.json().catch(() => ({}));
    if (!tr.ok || !tj.access_token) {
      out.textContent = 'トークン取得に失敗しました (HTTP ' + tr.status + ')\n' + JSON.stringify(tj, null, 2);
      return;
    }
    out.textContent = '① パートナートークン取得 OK\n② ドメインを登録中...';
    const rr = await fetch('https://fleet-api.prd.na.vn.cloud.tesla.com/api/1/partner_accounts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tj.access_token},
      body: JSON.stringify({domain: 'miyabi5215.github.io'})
    });
    const rj = await rr.json().catch(() => ({}));
    if (rr.ok) {
      out.textContent = '登録が完了しました ✅\n' + JSON.stringify(rj, null, 2);
    } else {
      out.textContent = '登録に失敗しました (HTTP ' + rr.status + ')\n' + JSON.stringify(rj, null, 2);
    }
  } catch (e) {
    out.textContent = '通信エラー: ' + e.message + '\n（CORS等でブロックされた可能性があります。この画面のスクリーンショットを撮ってください）';
  }
});
</script>
</body>
</html>
